<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biology 20: Circulation Mastery</title>
    <style>
        :root {
            --primary: #4f46e5; /* Indigo */
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --text-main: #000000; /* Strictly black text */
            --text-muted: #334155;
            --white: #ffffff;
            --correct: #10b981; /* Emerald */
            --wrong: #ef4444; /* Rose */
            --feedback-bg: #fffbeb;
            --feedback-border: #f59e0b;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
            line-height: 1.6;
        }

        #quiz-container {
            background-color: var(--white);
            width: 100%;
            max-width: 700px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        h1 { 
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 8px;
            margin-top: 0;
        }

        #progress { 
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 24px;
            display: block;
        }

        #question-text { 
            font-size: 1.35rem; 
            font-weight: 700; 
            margin-bottom: 25px; 
            color: var(--text-main);
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: var(--white);
            color: var(--text-main);
            text-align: left;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not([disabled]) { 
            border-color: var(--primary);
            background-color: #f5f3ff;
        }

        .correct { 
            background-color: #ecfdf5 !important; 
            border-color: var(--correct) !important; 
            color: #000000 !important;
            font-weight: 600;
        }

        .wrong { 
            background-color: #fef2f2 !important; 
            border-color: var(--wrong) !important; 
            color: #000000 !important;
        }

        #feedback-box {
            margin-top: 25px;
            padding: 20px;
            background-color: var(--feedback-bg);
            border-left: 6px solid var(--feedback-border);
            border-radius: 8px;
            color: var(--text-main);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #rationale-text { 
            margin-bottom: 20px; 
            color: var(--text-main);
        }

        #next-btn, .restart-btn {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: background 0.2s;
        }

        #next-btn:hover, .restart-btn:hover { background-color: var(--primary-hover); }

        .hidden { display: none; }

        /* Review Styles */
        .review-item {
            border-bottom: 1px solid #e2e8f0;
            padding: 20px 0;
            text-align: left;
            color: var(--text-main);
        }
        .review-q { font-weight: 700; margin-bottom: 5px; color: var(--text-main); }
        .review-a { color: #065f46; font-weight: 700; }
        .review-r { font-size: 0.95rem; color: var(--text-muted); margin-top: 5px; }
    </style>
</head>
<body>

    <div id="quiz-container">
        <span id="progress">Biology 20 Prep</span>
        <h1>Circulatory System Review</h1>
        
        <div id="quiz-content">
            <p id="question-text"></p>
            <div id="options-container"></div>
            
            <div id="feedback-box" class="hidden">
                <p id="rationale-text"></p>
                <button id="next-btn">Next Question →</button>
            </div>
        </div>

        <div id="results-screen" class="hidden" style="text-align: center;">
            <h2 style="font-size: 2rem; color: #000000;">Quiz Complete!</h2>
            <div id="final-score" style="font-size: 3rem; font-weight: 800; color: var(--primary); margin: 10px 0;"></div>
            
            <div id="missed-questions-container" style="margin-top: 40px;">
                <h3 style="border-bottom: 2px solid var(--wrong); padding-bottom: 10px; color: var(--wrong);">Questions to Review</h3>
                <div id="missed-list"></div>
            </div>

            <br><br>
            <button class="restart-btn" onclick="location.reload()">Try Again</button>
        </div>
    </div>
